name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package notices
        shell: pwsh
        run: |
          Copy-Item README.md build/Release/README.md
          Copy-Item third_party/json.LICENSE build/Release/JSON-LICENSE.txt
          Copy-Item third_party/spine-cpp/LICENSE build/Release/SPINE-RUNTIME-LICENSE.txt
          Copy-Item docs build/Release/docs -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: ZCodePet-windows-x64
          path: |
            build/Release/ZCodePet.exe
            build/Release/assets/
            build/Release/README.md
            build/Release/*LICENSE.txt
            build/Release/docs/
